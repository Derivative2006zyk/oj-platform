name: E2E

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install deps
        run: cd frontend && npm ci

      - name: Start test stack
        run: docker compose -f docker-compose.test.yml up -d --build

      - name: Wait backend healthy
        run: |
          for i in $(seq 1 60); do
            if curl -sf http://127.0.0.1:58000/health > /dev/null; then
              echo "backend ready"
              exit 0
            fi
            sleep 2
          done
          echo "backend not ready"
          docker compose -f docker-compose.test.yml logs backend
          exit 1

      - name: Install Playwright browsers
        run: cd frontend && npx playwright install --with-deps chromium

      - name: Run E2E
        env:
          E2E_BASE_URL: http://127.0.0.1:5173
          E2E_ADMIN_KEY: e2e-admin-key
          VITE_PROXY_TARGET: http://127.0.0.1:58000
        run: cd frontend && npx playwright test

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 7

      - name: Dump logs on failure
        if: failure()
        run: docker compose -f docker-compose.test.yml logs --tail=200

      - name: Stop test stack
        if: always()
        run: docker compose -f docker-compose.test.yml down -v